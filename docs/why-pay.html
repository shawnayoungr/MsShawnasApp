<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Why Pay? — Ms. Shawna</title>
  <link rel="stylesheet" href="./_assets/custom-welcome.css">
  <style>
    /* Minimal page: show the why-pay artwork full-bleed on mobile */
    .why-pay-root{display:flex;align-items:flex-start;justify-content:center;background:#fff;padding:12px}
    .why-pay-root img{max-width:100%;height:auto;display:block;border-radius:10px}
    @media(min-width:700px){.why-pay-root{padding:24px}}
  </style>
</head>
<body>
  <header class="top-nav">
    <div class="nav-inner">
      <div class="brand" aria-hidden="true">&nbsp;</div>
      <button id="menu-toggle" class="menu-toggle" aria-label="Open menu">☰</button>
    </div>
    <nav class="offcanvas" id="site-menu" aria-hidden="true">
      <button id="menu-close" class="menu-close" aria-label="Close menu">✕</button>
      <ul class="menu-list">
        <li><a href="index.html">Welcome</a></li>
        <li><a href="student.html">For Students</a></li>
        <li><a href="parent.html">What Parents Need to Know</a></li>
        <li><a href="who-is-ms.html">Who is Ms. Shawna</a></li>
        <li><a href="set-up-session.html">Set Up a Session</a></li>
        <li><a href="why-pay.html">Why Pay?</a></li>
      </ul>
    </nav>
  </header>

  <div class="why-pay-root">
    <img src="./_assets/images/why-pay.png" alt="Why Pay" />
  </div>

  <script>
    // off-canvas menu behavior (same pattern used across the docs pages)
    (function(){
      const toggle = document.getElementById('menu-toggle');
      const close = document.getElementById('menu-close');
      const menu = document.getElementById('site-menu');
      if(toggle && menu){ toggle.addEventListener('click', ()=>{ menu.setAttribute('aria-hidden','false'); }); }
      if(close && menu){ close.addEventListener('click', ()=>{ menu.setAttribute('aria-hidden','true'); }); }
    })();
  </script>
</body>
</html>
