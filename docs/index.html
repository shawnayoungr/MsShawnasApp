<!doctype html>
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ms. Shawna — Welcome</title>
 
  <link href="https://fonts.googleapis.com/css2?family=Rubik+Distressed&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Londrina+Solid:wght@100;300;400;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Bevan&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Titan+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./_assets/custom-welcome.css">
  <style>
    /* Titan One heading for the top hero — prominent, bold mobile-first heading */
    .titan-one-regular { font-family: "Titan One", sans-serif; font-weight:400; font-style:normal; }
    .hero-heading.titan-one-regular{
      display:block;
      background: transparent; /* remove pill box */
      color: #071233;
      padding: 0; /* remove pill padding */
      border-radius: 0;
      box-shadow: none;
      font-size: 22px; /* bigger on mobile */
      line-height:1.02;
      text-align:center;
      margin:12px auto 8px auto;
      max-width: 92%;
  -webkit-font-smoothing:antialiased;
  letter-spacing: -1px;
      text-shadow: 0 2px 0 rgba(0,0,0,0.06), 0 6px 18px rgba(0,0,0,0.06);
    }
    /* Slightly larger on small tablets/large phones */
    @media(min-width:420px){
      .hero-heading.titan-one-regular{font-size:40px}
    }
    @media(min-width:700px){
      .hero-heading.titan-one-regular{font-size:48px}
    }
  </style>
</head>
<body>
  <header class="top-nav">
    <div class="nav-inner">
      <div class="brand" aria-hidden="true">&nbsp;</div>
      <button id="menu-toggle" class="menu-toggle" aria-label="Open menu">☰</button>
    </div>
    <nav class="offcanvas" id="site-menu" aria-hidden="true">
      <button id="menu-close" class="menu-close" aria-label="Close menu">✕</button>
      <ul class="menu-list">
        <li><a href="index.html">Welcome</a></li>
        <li><a href="student.html">For Students</a></li>
        <li><a href="parent.html">What Parents Need to Know</a></li>
        <li><a href="who-is-ms.html">Who is Ms. Shawna</a></li>
        <li><a href="set-up-session.html">Set Up a Session</a></li>
        <li><a href="why-pay.html">Why Pay?</a></li>
      </ul>
    </nav>
  </header>

  <section>
    <!-- Sliced hero images placed directly so CSS hooks don't interfere -->
  <h1 class="hero-heading titan-one-regular">Helping <br> students &amp; parents <br> navigate the college admissions process.</h1>
  <a href="student.html" aria-label="I am a student - learn more">
      <img src="./_assets/images/welcomestudent.png" alt="I'm a Student" class="hero-collage">
    </a>
    <a href="parent.html" aria-label="I am a parent - learn more">
      <img src="./_assets/images/welcomeparent.png" alt="I'm a Parent" class="hero-collage">
    </a>
    <img src="./_assets/images/welcomemid.png" alt="hero middle" class="hero-collage hero-mid">
    <div class="hero-wrapper">
      <img src="./_assets/images/welcomebottom.png" alt="hero bottom" class="hero-collage hero-bottom">
      <!-- overlay placed over the lime pill within the bottom hero image (mobile-first) -->
  <a class="index-pill-overlay" href="sms:+16822680063?body=Ms.%20Shawna%20I%20need%20help.%20My%20name%20is" aria-label="Text Ms. Shawna" title="Text Ms. Shawna" style="left:52%;top:20%;width:40%;height:26%"></a>
    </div>
  </section>



  <script>
    // small enhancement: make header roles keyboard accessible
    document.querySelectorAll('.role').forEach(btn=>btn.addEventListener('click', ()=>{btn.classList.toggle('active')}));

    // off-canvas menu toggle
    (function(){
      const toggle = document.getElementById('menu-toggle');
      const close = document.getElementById('menu-close');
      const menu = document.getElementById('site-menu');
      if(toggle && menu){
        toggle.addEventListener('click', ()=>{menu.setAttribute('aria-hidden','false')});
      }
      if(close && menu){
        close.addEventListener('click', ()=>{menu.setAttribute('aria-hidden','true')});
      }
    })();
  </script>
</body>
</html>
